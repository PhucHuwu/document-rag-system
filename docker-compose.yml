# Shared env for the AI API and the AI worker (same image, different command).
x-ai-env: &ai-env
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: tina_chunks
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: tina-documents
  CORE_BACKEND_URL: http://api:3001
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  COHERE_API_KEY: ${COHERE_API_KEY:-}
  RERANKER_MODEL: ${RERANKER_MODEL:-rerank-multilingual-v3.0}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Tina Chatbot}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-4.1-mini}

services:
  postgres:
    image: postgres:17-alpine
    container_name: tina-postgres
    environment:
      POSTGRES_USER: tina
      POSTGRES_PASSWORD: tina
      POSTGRES_DB: tina_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tina -d tina_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tina-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: tina-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    image: tina-ai:local
    container_name: tina-ai
    environment:
      <<: *ai-env
      AI_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started

  ai-worker:
    image: tina-ai:local
    container_name: tina-ai-worker
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *ai-env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ai:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tina-api
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://tina:tina@postgres:5432/tina_chatbot
      REDIS_URL: redis://redis:6379
      AI_BACKEND_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tina-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  hf_cache:
